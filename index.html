<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Despensa | Banco de alimentos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

    :root {
      color-scheme: light;
      --paper: #f6f7f3;
      --surface: #fff;
      --ink: #202b28;
      --muted: #687571;
      --line: #e2e8e3;
      --green: #176f55;
      --green-pale: #e4f2e9;
      --orange: #a44c22;
      --orange-pale: #fff0e3;
      --red: #ad3b35;
      --red-pale: #fbe9e6;
      --teal: #167c83;
      --shadow: 0 2px 12px rgb(34 55 46 / 5%);
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid #65a797; outline-offset: 2px; }
    .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { display: flex; flex-direction: column; padding: 27px 17px 18px; background: #fff; border-right: 1px solid var(--line); }
    .brand { display: flex; gap: 11px; align-items: center; padding: 0 10px 29px; }
    .brand-mark { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 12px; color: white; background: var(--green); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font: 800 17px Manrope, sans-serif; letter-spacing: 0; }
    .brand-caption { margin-top: 1px; color: var(--muted); font-size: 11px; }
    .nav-label { padding: 0 11px; margin: 9px 0 7px; color: #84908b; font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 11px 12px; border: 0; border-radius: 7px; background: transparent; color: #53615c; text-align: left; font-weight: 600; }
    .nav button:hover { background: #f3f6f2; }
    .nav button.active { background: var(--green-pale); color: #145c45; }
    .nav svg { width: 19px; height: 19px; flex: none; }
    .side-bottom { margin-top: auto; }
    .privacy-note { margin: 18px 4px 13px; padding: 13px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .privacy-note strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 12px; }
    .side-foot { padding: 0 10px; color: #818d87; font-size: 10px; }
    main { min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 69px; padding: 0 34px; border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 78%); }
    .today { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; gap: 9px; }
    .mobile-brand, .mobile-nav { display: none; }
    .content { width: min(1120px, 100%); margin: 0 auto; padding: 34px; }
    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 25px; }
    h1 { margin: 0; font: 800 27px Manrope, sans-serif; letter-spacing: 0; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .btn { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .btn:hover { background: #f3f6f2; }
    .btn-primary { border-color: var(--green); background: var(--green); color: white; }
    .btn-primary:hover { background: #105a43; }
    .btn svg { width: 16px; height: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 19px; }
    .metric { padding: 17px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .metric-label { color: var(--muted); font-size: 11px; font-weight: 600; }
    .metric-value { margin-top: 8px; font: 800 27px Manrope, sans-serif; line-height: 1; }
    .metric-note { margin-top: 7px; color: #77837d; font-size: 10px; }
    .metric.warn .metric-value { color: var(--orange); }
    .metric.danger .metric-value { color: var(--red); }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, .9fr); gap: 15px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 17px 18px 13px; }
    .panel-title { margin: 0; font: 700 14px Manrope, sans-serif; letter-spacing: 0; }
    .panel-link { padding: 4px 0; border: 0; background: none; color: var(--green); font-size: 11px; font-weight: 700; }
    .panel-body { padding: 0 18px 17px; }
    .expiry-list, .activity-list { display: grid; }
    .expiry-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #edf0ed; }
    .food-name { font-size: 12px; font-weight: 700; }
    .food-meta { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .tag.ok { background: var(--green-pale); color: #176247; }
    .tag.soon { background: var(--orange-pale); color: #914219; }
    .tag.expired { background: var(--red-pale); color: #98332e; }
    .activity-row { display: grid; grid-template-columns: 29px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid #edf0ed; }
    .activity-icon { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #e8f3ef; color: var(--green); }
    .activity-icon svg { width: 15px; height: 15px; }
    .activity-copy { font-size: 11px; line-height: 1.5; }
    .activity-copy strong { font-weight: 700; }
    .activity-time { margin-top: 2px; color: #84908a; font-size: 10px; }
    .empty { padding: 25px 10px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.6; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 13px; }
    .empty-action { margin-top: 12px; }
    .section-panel { margin-top: 15px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 10px 16px; border-top: 1px solid var(--line); background: #fafbf9; color: #74817b; font-size: 10px; font-weight: 700; }
    td { padding: 12px 16px; border-top: 1px solid #edf0ed; font-size: 11px; }
    .table-empty { padding: 32px 18px; color: var(--muted); text-align: center; font-size: 12px; }
    .family-name { font-weight: 700; }
    .muted { color: var(--muted); }
    .form-panel { max-width: 650px; padding: 21px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { color: #394640; font-size: 11px; font-weight: 700; }
    input, select, textarea { width: 100%; min-height: 42px; padding: 10px 11px; border: 1px solid #d6dfd8; border-radius: 5px; background: #fff; color: var(--ink); font-size: 12px; }
    textarea { min-height: 75px; resize: vertical; }
    .hint { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .form-alert { display: none; margin-top: 14px; padding: 11px 12px; border-radius: 5px; background: var(--orange-pale); color: #824019; font-size: 11px; line-height: 1.5; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 3; max-width: min(400px, calc(100vw - 32px)); padding: 13px 17px; border-radius: 6px; background: #203d33; color: white; box-shadow: 0 6px 24px #172a2433; font-size: 12px; }
    .toast[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 205px minmax(0, 1fr); }
      .content { padding: 27px 22px; }
      .topbar { padding: 0 22px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .shell { display: block; padding-bottom: 62px; }
      .sidebar { display: none; }
      .topbar { height: 58px; padding: 0 16px; }
      .mobile-brand { display: flex; gap: 8px; align-items: center; font: 800 14px Manrope, sans-serif; }
      .mobile-brand .brand-mark { width: 31px; height: 31px; border-radius: 9px; }
      .mobile-brand .brand-mark svg { width: 18px; }
      .today { font-size: 10px; }
      .top-actions .btn { min-height: 34px; padding: 0 9px; font-size: 10px; }
      .top-actions .btn svg { width: 14px; }
      .content { padding: 25px 15px; }
      .page-heading { align-items: center; margin-bottom: 19px; }
      h1 { font-size: 23px; }
      .subtitle { max-width: 230px; font-size: 11px; line-height: 1.5; }
      .page-heading > .btn { width: 40px; min-width: 40px; padding: 0; font-size: 0; }
      .page-heading > .btn svg { width: 18px; height: 18px; }
      .metrics { gap: 8px; }
      .metric { padding: 13px; }
      .metric-value { font-size: 24px; }
      .metric-label { font-size: 10px; }
      .panel-head { padding: 15px 14px 12px; }
      .panel-body { padding: 0 14px 13px; }
      .mobile-nav { position: fixed; inset: auto 0 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 5px max(6px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
      .mobile-nav button { display: grid; justify-items: center; gap: 3px; padding: 4px 0; border: 0; background: transparent; color: #66736d; font-size: 9px; font-weight: 600; }
      .mobile-nav button.active { color: var(--green); }
      .mobile-nav svg { width: 19px; height: 19px; }
      .form-panel { padding: 15px; }
      .form-grid { gap: 12px; }
      td, th { padding: 10px 12px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .content { animation: enter .24s ease-out both; }
      @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c-4-2-7-5-7-10V5l7-3 7 3v6c0 5-3 8-7 10Z"/><path d="M8 12h8M12 8v8"/></svg></div>
        <div><div class="brand-name">Despensa</div><div class="brand-caption">Banco de alimentos</div></div>
      </div>
      <div class="nav-label">Organización</div>
      <nav class="nav" id="desktop-nav">
        <button class="active" data-page="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>Resumen</button>
        <button data-page="inventario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>Inventario</button>
        <button data-page="familias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1H3ZM16 5.2a3 3 0 0 1 0 5.6M18 14a5 5 0 0 1 3 4.6v1h-3"/></svg>Familias</button>
        <button data-page="entregas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/><path d="M6 10h5M6 13h5"/></svg>Entregas</button>
      </nav>
      <div class="side-bottom">
        <div class="privacy-note"><strong>Datos en este dispositivo</strong>La información se guarda en este navegador. No se envía a ningún servidor.</div>
        <div class="side-foot">Hecho para el trabajo del barrio</div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21c-4-2-7-5-7-10V5l7-3 7 3v6c0 5-3 8-7 10Z"/><path d="M8 12h8M12 8v8"/></svg></span>Despensa</div>
        <div class="today" id="today-label"></div>
        <div class="top-actions"><button class="btn" data-go="familias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nueva familia</button></div>
      </header>
      <div id="app" class="content" aria-live="polite"></div>
    </main>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Navegación principal">
    <button class="active" data-page="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg>Resumen</button>
    <button data-page="inventario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 7 8-4 8 4-8 4-8-4ZM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>Alimentos</button>
    <button data-page="familias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1H3ZM16 5.2a3 3 0 0 1 0 5.6M18 14a5 5 0 0 1 3 4.6v1h-3"/></svg>Familias</button>
    <button data-page="entregas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/></svg>Entregas</button>
  </nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    (() => {
      const STORAGE_KEY = 'despensa-banco-alimentos-v1';
      const emptyState = { lots: [], families: [], deliveries: [] };
      let state;
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        state = saved && Array.isArray(saved.lots) && Array.isArray(saved.families) && Array.isArray(saved.deliveries) ? saved : structuredClone(emptyState);
      } catch { state = structuredClone(emptyState); }
      let currentPage = 'inicio';
      let toastTimer;
      const app = document.getElementById('app');
      const icons = {
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 7 8-4 8 4-8 4-8-4ZM4 12l8 4 8-4M4 17l8 4 8-4"/></svg>',
        delivery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h11v11H3zM14 11h4l3 3v4h-7z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="17.5" cy="19" r="1.5"/></svg>'
      };
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      const todayISO = () => new Date().toISOString().slice(0, 10);
      const localDate = date => {
        if (!date) return 'Sin fecha';
        const [year, month, day] = date.split('-').map(Number);
        return new Date(year, month - 1, day).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
      };
      const daysUntil = date => Math.ceil((new Date(`${date}T12:00:00`) - new Date(`${todayISO()}T12:00:00`)) / 86400000);
      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const showToast = message => {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
      };
      const setPage = page => {
        currentPage = page;
        document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === page));
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const activeLots = () => state.lots.filter(lot => Number(lot.quantity) > 0);
      const totalStock = () => activeLots().filter(lot => daysUntil(lot.expiry) >= 0).reduce((sum, lot) => sum + Number(lot.quantity), 0);
      const recentDeliveries = () => [...state.deliveries].sort((a, b) => b.date.localeCompare(a.date));
      const familyById = id => state.families.find(family => family.id === id);
      const expiryTag = lot => {
        const days = daysUntil(lot.expiry);
        if (days < 0) return '<span class="tag expired">Caducado</span>';
        if (days === 0) return '<span class="tag expired">Vence hoy</span>';
        if (days <= 7) return `<span class="tag soon">${days === 1 ? 'Vence mañana' : `Vence en ${days} días`}</span>`;
        return `<span class="tag ok">${localDate(lot.expiry)}</span>`;
      };
      const heading = (title, subtitle, action = '') => `<div class="page-heading"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action}</div>`;
      const actionButton = (text, page, icon = 'plus') => `<button class="btn btn-primary" data-go="${page}">${icons[icon]}${text}</button>`;
      const emptyMessage = (title, copy, page, label) => `<div class="empty"><strong>${title}</strong>${copy}${page ? `<div class="empty-action"><button class="btn btn-primary" data-go="${page}">${icons.plus}${label}</button></div>` : ''}</div>`;

      function renderHome() {
        const soon = activeLots().filter(lot => daysUntil(lot.expiry) <= 7).sort((a, b) => a.expiry.localeCompare(b.expiry));
        const urgent = soon.filter(lot => daysUntil(lot.expiry) >= 0).length;
        const expired = activeLots().filter(lot => daysUntil(lot.expiry) < 0).length;
        const activity = recentDeliveries().slice(0, 5);
        app.innerHTML = `${heading('Resumen', 'Lo importante del banco, de un vistazo.', actionButton('Anotar donación', 'inventario'))}
          <section class="metrics" aria-label="Resumen de actividad">
            <div class="metric"><div class="metric-label">Alimentos disponibles</div><div class="metric-value">${totalStock()}</div><div class="metric-note">unidades registradas</div></div>
            <div class="metric ${urgent ? 'warn' : ''}"><div class="metric-label">Por vencer pronto</div><div class="metric-value">${urgent}</div><div class="metric-note">en los próximos 7 días</div></div>
            <div class="metric ${expired ? 'danger' : ''}"><div class="metric-label">Caducados</div><div class="metric-value">${expired}</div><div class="metric-note">separar del alimento disponible</div></div>
            <div class="metric"><div class="metric-label">Familias registradas</div><div class="metric-value">${state.families.length}</div><div class="metric-note">con historial de atención</div></div>
          </section>
          <div class="dashboard-grid">
            <section class="panel"><div class="panel-head"><h2 class="panel-title">Lo que vence primero</h2><button class="panel-link" data-go="inventario">Ver inventario</button></div><div class="panel-body">${soon.length ? `<div class="expiry-list">${soon.slice(0, 5).map(lot => `<div class="expiry-row"><div><div class="food-name">${esc(lot.name)} <span class="muted">· ${lot.quantity} ${esc(lot.unit)}</span></div><div class="food-meta">${esc(lot.category)}${lot.donor ? ` · Donó ${esc(lot.donor)}` : ''}</div></div>${expiryTag(lot)}</div>`).join('')}</div>` : emptyMessage('Todo al día', 'Aquí aparecerán los alimentos próximos a vencer.', null, '')}</div></section>
            <section class="panel"><div class="panel-head"><h2 class="panel-title">Últimas entregas</h2><button class="panel-link" data-go="entregas">Ver historial</button></div><div class="panel-body">${activity.length ? `<div class="activity-list">${activity.map(delivery => `<div class="activity-row"><div class="activity-icon">${icons.delivery}</div><div class="activity-copy"><strong>${esc(familyById(delivery.familyId)?.name || 'Familia')}</strong> recibió ${esc(delivery.items.map(item => `${item.quantity} ${item.unit} de ${item.name}`).join(', '))}<div class="activity-time">${localDate(delivery.date)}</div></div></div>`).join('')}</div>` : emptyMessage('Aún no hay entregas', 'Registra cada entrega para mantener un reparto claro.', 'entregas', 'Registrar entrega')}</div></section>
          </div>
          <section class="panel section-panel"><div class="panel-head"><h2 class="panel-title">Accesos rápidos</h2></div><div class="panel-body" style="display:flex;flex-wrap:wrap;gap:9px"><button class="btn" data-go="inventario">${icons.box}Registrar donación</button><button class="btn" data-go="familias">${icons.plus}Añadir familia</button><button class="btn" data-go="entregas">${icons.delivery}Registrar entrega</button></div></section>`;
      }

      function renderInventory() {
        const lots = [...activeLots()].sort((a, b) => a.expiry.localeCompare(b.expiry));
        app.innerHTML = `${heading('Inventario', 'Cada donación queda separada por fecha de vencimiento.', actionButton('Anotar donación', 'inventario'))}
          <section class="panel form-panel"><h2 class="panel-title" style="margin-bottom:17px">Nueva donación</h2>
            <form id="donation-form"><div class="form-grid">
              <div class="field"><label for="food-name">Alimento</label><input id="food-name" name="name" placeholder="Ej.: arroz" required maxlength="60"></div>
              <div class="field"><label for="food-category">Tipo</label><select id="food-category" name="category"><option>Secos y conservas</option><option>Frutas y verduras</option><option>Lácteos</option><option>Panadería</option><option>Refrigerados</option><option>Otros</option></select></div>
              <div class="field"><label for="food-quantity">Cantidad</label><input id="food-quantity" name="quantity" type="number" min="0.1" step="0.1" placeholder="0" required></div>
              <div class="field"><label for="food-unit">Unidad</label><select id="food-unit" name="unit"><option>unidades</option><option>kg</option><option>g</option><option>litros</option><option>cajas</option><option>paquetes</option></select></div>
              <div class="field"><label for="food-expiry">Fecha de vencimiento</label><input id="food-expiry" name="expiry" type="date" required><span class="hint">Si no aparece en el envase, consulta antes de registrar.</span></div>
              <div class="field"><label for="food-donor">Quién donó <span class="muted">(opcional)</span></label><input id="food-donor" name="donor" maxlength="60" placeholder="Nombre o comercio"></div>
            </div><div class="form-actions"><button class="btn btn-primary" type="submit">${icons.plus}Guardar donación</button></div></form>
          </section>
          <section class="panel section-panel"><div class="panel-head"><h2 class="panel-title">Alimentos en almacén</h2><span class="muted" style="font-size:11px">${lots.length} ${lots.length === 1 ? 'lote' : 'lotes'}</span></div>${lots.length ? `<div class="table-wrap"><table><thead><tr><th>Alimento</th><th>Cantidad</th><th>Vencimiento</th><th>Donó</th></tr></thead><tbody>${lots.map(lot => `<tr><td><span class="family-name">${esc(lot.name)}</span><div class="food-meta">${esc(lot.category)}</div></td><td>${lot.quantity} ${esc(lot.unit)}</td><td>${expiryTag(lot)}</td><td>${esc(lot.donor || '—')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="table-empty">Todavía no hay alimentos. Anota una donación cuando llegue.</div>`}</section>`;
        document.getElementById('donation-form').addEventListener('submit', event => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const quantity = Number(form.get('quantity'));
          const expiry = String(form.get('expiry'));
          if (quantity <= 0 || !expiry) return;
          state.lots.push({ id: crypto.randomUUID(), name: String(form.get('name')).trim(), category: String(form.get('category')), quantity, unit: String(form.get('unit')), expiry, donor: String(form.get('donor')).trim(), receivedAt: todayISO() });
          save(); renderInventory(); showToast('Donación anotada. ¡Gracias!');
        });
      }

      function renderFamilies() {
        const families = [...state.families].sort((a, b) => a.name.localeCompare(b.name, 'es'));
        const deliveries = recentDeliveries();
        app.innerHTML = `${heading('Familias', 'Consulta cuándo recibió apoyo cada hogar.', actionButton('Añadir familia', 'familias'))}
          <section class="panel form-panel"><h2 class="panel-title" style="margin-bottom:17px">Nueva familia</h2><form id="family-form"><div class="form-grid">
            <div class="field"><label for="family-name">Nombre para identificar el hogar</label><input id="family-name" name="name" placeholder="Ej.: Familia García" required maxlength="60"></div>
            <div class="field"><label for="family-size">Personas en el hogar <span class="muted">(opcional)</span></label><input id="family-size" name="size" type="number" min="1" max="30" placeholder="—"></div>
            <div class="field full"><span class="hint">No anotes documentos, direcciones ni información sensible. El registro queda en este navegador.</span></div>
          </div><div class="form-actions"><button class="btn btn-primary" type="submit">${icons.plus}Guardar familia</button></div></form></section>
          <section class="panel section-panel"><div class="panel-head"><h2 class="panel-title">Hogares registrados</h2><span class="muted" style="font-size:11px">${families.length}</span></div>${families.length ? `<div class="table-wrap"><table><thead><tr><th>Familia</th><th>Personas</th><th>Última entrega</th><th>Entregas registradas</th></tr></thead><tbody>${families.map(family => { const history = deliveries.filter(delivery => delivery.familyId === family.id); return `<tr><td class="family-name">${esc(family.name)}</td><td>${family.size || '—'}</td><td>${history.length ? localDate(history[0].date) : '<span class="muted">Sin entregas</span>'}</td><td>${history.length}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="table-empty">Añade una familia para empezar a registrar las entregas.</div>`}</section>`;
        document.getElementById('family-form').addEventListener('submit', event => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const name = String(form.get('name')).trim();
          if (!name) return;
          state.families.push({ id: crypto.randomUUID(), name, size: Number(form.get('size')) || null, createdAt: todayISO() });
          save(); renderFamilies(); showToast('Familia añadida.');
        });
      }

      function renderDeliveries() {
        const eligibleLots = activeLots().filter(lot => daysUntil(lot.expiry) >= 0).sort((a, b) => a.expiry.localeCompare(b.expiry));
        const families = [...state.families].sort((a, b) => a.name.localeCompare(b.name, 'es'));
        const history = recentDeliveries();
        app.innerHTML = `${heading('Entregas', 'Registra el apoyo recibido por cada familia.', actionButton('Nueva entrega', 'entregas', 'delivery'))}
          <section class="panel form-panel"><h2 class="panel-title" style="margin-bottom:17px">Registrar entrega</h2>
          ${families.length && eligibleLots.length ? `<form id="delivery-form"><div class="form-grid">
            <div class="field"><label for="delivery-family">Familia</label><select id="delivery-family" name="familyId" required><option value="">Elige una familia</option>${families.map(family => `<option value="${family.id}">${esc(family.name)}</option>`).join('')}</select></div>
            <div class="field"><label for="delivery-date">Fecha</label><input id="delivery-date" name="date" type="date" value="${todayISO()}" max="${todayISO()}" required></div>
            <div class="field full"><label for="delivery-lot">Alimento</label><select id="delivery-lot" name="lotId" required><option value="">Elige un alimento</option>${eligibleLots.map(lot => `<option value="${lot.id}">${esc(lot.name)} · ${lot.quantity} ${esc(lot.unit)} disponibles · vence ${localDate(lot.expiry)}</option>`).join('')}</select><span class="hint">Los lotes con vencimiento más próximo se descuentan primero.</span></div>
            <div class="field"><label for="delivery-quantity">Cantidad entregada</label><input id="delivery-quantity" name="quantity" type="number" min="0.1" step="0.1" placeholder="0" required></div>
            <div class="field"><label for="delivery-note">Nota <span class="muted">(opcional)</span></label><input id="delivery-note" name="note" maxlength="100" placeholder="Ej.: retiro por la mañana"></div>
          </div><div class="form-alert" id="recent-warning" role="status"></div><div class="form-actions"><button class="btn btn-primary" type="submit">${icons.delivery}Guardar entrega</button></div></form>` : emptyMessage(families.length ? 'No hay alimentos disponibles' : 'Primero registra una familia', families.length ? 'Las donaciones caducadas no se pueden incluir en una entrega.' : 'Necesitas una familia registrada antes de anotar su entrega.', families.length ? 'inventario' : 'familias', families.length ? 'Anotar donación' : 'Añadir familia')}
          </section>
          <section class="panel section-panel"><div class="panel-head"><h2 class="panel-title">Historial de entregas</h2><span class="muted" style="font-size:11px">${history.length}</span></div>${history.length ? `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Familia</th><th>Alimentos</th><th>Nota</th></tr></thead><tbody>${history.map(delivery => `<tr><td>${localDate(delivery.date)}</td><td class="family-name">${esc(familyById(delivery.familyId)?.name || 'Familia eliminada')}</td><td>${delivery.items.map(item => `${item.quantity} ${esc(item.unit)} de ${esc(item.name)}`).join('<br>')}</td><td>${esc(delivery.note || '—')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="table-empty">Todavía no hay entregas registradas.</div>`}</section>`;
        const form = document.getElementById('delivery-form');
        if (!form) return;
        const familySelect = document.getElementById('delivery-family');
        const warning = document.getElementById('recent-warning');
        familySelect.addEventListener('change', () => {
          const last = recentDeliveries().find(delivery => delivery.familyId === familySelect.value);
          const recent = last && (new Date(`${todayISO()}T12:00:00`) - new Date(`${last.date}T12:00:00`)) / 86400000 < 7;
          warning.style.display = recent ? 'block' : 'none';
          warning.textContent = recent ? `${familyById(familySelect.value)?.name} recibió apoyo el ${localDate(last.date)}. Revisa el historial antes de continuar; puedes registrar la entrega si corresponde.` : '';
        });
        document.getElementById('delivery-lot').addEventListener('change', event => {
          const lot = state.lots.find(item => item.id === event.target.value);
          const quantity = document.getElementById('delivery-quantity');
          quantity.max = lot ? lot.quantity : '';
          quantity.placeholder = lot ? `Máximo ${lot.quantity} ${lot.unit}` : '0';
        });
        form.addEventListener('submit', event => {
          event.preventDefault();
          const formData = new FormData(form);
          const familyId = String(formData.get('familyId'));
          const lot = state.lots.find(item => item.id === formData.get('lotId'));
          const quantity = Number(formData.get('quantity'));
          const date = String(formData.get('date'));
          if (!familyById(familyId) || !lot || daysUntil(lot.expiry) < 0 || quantity <= 0 || quantity > Number(lot.quantity) || date > todayISO()) {
            showToast('Revisa la cantidad, el alimento y la fecha.');
            return;
          }
          const last = recentDeliveries().find(delivery => delivery.familyId === familyId);
          const recent = last && (new Date(`${date}T12:00:00`) - new Date(`${last.date}T12:00:00`)) / 86400000 < 7;
          if (recent && !window.confirm(`${familyById(familyId).name} recibió apoyo el ${localDate(last.date)}. ¿Quieres registrar otra entrega?`)) return;
          lot.quantity = Math.round((Number(lot.quantity) - quantity) * 100) / 100;
          state.deliveries.push({ id: crypto.randomUUID(), familyId, date, items: [{ name: lot.name, unit: lot.unit, quantity }], note: String(formData.get('note')).trim() });
          save(); renderDeliveries(); showToast('Entrega guardada y descontada del inventario.');
        });
      }

      function render() {
        document.getElementById('today-label').textContent = new Date().toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (currentPage === 'inicio') renderHome();
        if (currentPage === 'inventario') renderInventory();
        if (currentPage === 'familias') renderFamilies();
        if (currentPage === 'entregas') renderDeliveries();
      }
      document.addEventListener('click', event => {
        const pageButton = event.target.closest('[data-page]');
        if (pageButton) setPage(pageButton.dataset.page);
        const goButton = event.target.closest('[data-go]');
        if (goButton) setPage(goButton.dataset.go);
      });
      render();
    })();
  </script>
</body>
</html>
